<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Rotating Globe</title>
    <style>
        /* Reset margins and set a dark background to make the glowing lines pop */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050810; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <canvas id="globeCanvas"></canvas>

    <script>
        const canvas = document.getElementById('globeCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const radius = 200; // Size of the globe
        const latCount = 18; // Number of horizontal rings
        const lonCount = 24; // Number of vertical slices
        const segments = 64; // How smooth the circles are drawn

        // Handle window resizing
        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        // Array to hold all the 3D points forming our lines
        const lines = [];

        // 1. Generate Latitude Lines
        for (let i = 1; i < latCount; i++) {
            const phi = (i * Math.PI) / latCount;
            const y = radius * Math.cos(phi);
            const r = radius * Math.sin(phi);
            const line = [];
            for (let j = 0; j <= segments; j++) {
                const theta = (j * 2 * Math.PI) / segments;
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                line.push({ x, y, z });
            }
            lines.push(line);
        }

        // 2. Generate Longitude Lines
        for (let i = 0; i < lonCount; i++) {
            const theta = (i * 2 * Math.PI) / lonCount;
            const line = [];
            for (let j = 0; j <= segments; j++) {
                const phi = (j * Math.PI) / segments;
                const y = radius * Math.cos(phi);
                const r = radius * Math.sin(phi);
                const x = r * Math.cos(theta);
                const z = r * Math.sin(theta);
                line.push({ x, y, z });
            }
            lines.push(line);
        }

        let time = 0;
        const tilt = 23.5 * (Math.PI / 180); // Earth's axial tilt for realism
        const camZ = 800; // Camera distance for perspective projection

        // Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Rotation speed
            time -= 0.003; 

            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.lineWidth = 1.2;

            lines.forEach(line => {
                for (let i = 0; i < line.length - 1; i++) {
                    const p1 = line[i];
                    const p2 = line[i + 1];

                    // --- Transform Point 1 ---
                    // Spin around Y axis
                    let x1_1 = p1.x * Math.cos(time) - p1.z * Math.sin(time);
                    let y1_1 = p1.y;
                    let z1_1 = p1.x * Math.sin(time) + p1.z * Math.cos(time);

                    // Apply axial tilt (Rotate around X axis)
                    let x2_1 = x1_1;
                    let y2_1 = y1_1 * Math.cos(tilt) - z1_1 * Math.sin(tilt);
                    let z2_1 = y1_1 * Math.sin(tilt) + z1_1 * Math.cos(tilt);

                    // --- Transform Point 2 ---
                    // Spin around Y axis
                    let x1_2 = p2.x * Math.cos(time) - p2.z * Math.sin(time);
                    let y1_2 = p2.y;
                    let z1_2 = p2.x * Math.sin(time) + p2.z * Math.cos(time);

                    // Apply axial tilt (Rotate around X axis)
                    let x2_2 = x1_2;
                    let y2_2 = y1_2 * Math.cos(tilt) - z1_2 * Math.sin(tilt);
                    let z2_2 = y1_2 * Math.sin(tilt) + z1_2 * Math.cos(tilt);

                    // Calculate average Z-depth to determine opacity (fades out the back side)
                    let avgZ = (z2_1 + z2_2) / 2;
                    let normalizedZ = (avgZ + radius) / (radius * 2); 
                    // Opacity ranges from 0.1 (far side) to 1.0 (near side)
                    let opacity = 0.1 + 0.9 * (1 - normalizedZ);

                    // --- Project to 2D Screen ---
                    let scale1 = camZ / (camZ + z2_1);
                    let px1 = x2_1 * scale1;
                    let py1 = y2_1 * scale1;

                    let scale2 = camZ / (camZ + z2_2);
                    let px2 = x2_2 * scale2;
                    let py2 = y2_2 * scale2;

                    // Draw the segment
                    ctx.beginPath();
                    ctx.moveTo(px1, py1);
                    ctx.lineTo(px2, py2);
                    // Light cyan color matching the calculated opacity
                    ctx.strokeStyle = `rgba(0, 200, 255, ${opacity})`;
                    ctx.stroke();
                }
            });

            ctx.restore();
            requestAnimationFrame(animate); // Loop continuously 
        }

        // Start animation
        animate();
    </script>
</body>
</html>
