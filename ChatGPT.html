<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Rotating Globe</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        overflow: hidden;
        background: #050816;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        perspective: 1000px;
        font-family: Arial, sans-serif;
    }

    .scene {
        width: 400px;
        height: 400px;
        position: relative;
        transform-style: preserve-3d;
    }

    .globe {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        animation: rotateGlobe 16s linear infinite;
    }

    .latitude,
    .longitude {
        position: absolute;
        border: 1px solid rgba(0, 200, 255, 0.35);
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform-style: preserve-3d;
        box-shadow: 0 0 12px rgba(0, 200, 255, 0.2);
    }

    @keyframes rotateGlobe {
        from {
            transform: rotateX(-20deg) rotateY(0deg);
        }
        to {
            transform: rotateX(-20deg) rotateY(360deg);
        }
    }

    .glow {
        position: absolute;
        width: 420px;
        height: 420px;
        border-radius: 50%;
        background: radial-gradient(
            circle,
            rgba(0, 200, 255, 0.12),
            rgba(0, 0, 0, 0)
        );
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        filter: blur(20px);
    }
</style>
</head>
<body>

<div class="scene">
    <div class="glow"></div>
    <div class="globe" id="globe"></div>
</div>

<script>
    const globe = document.getElementById("globe");
    const radius = 150;

    // Create latitude lines
    for (let i = -75; i <= 75; i += 15) {
        const lat = document.createElement("div");
        lat.className = "latitude";

        const scale = Math.cos(i * Math.PI / 180);
        const size = radius * 2 * scale;

        lat.style.width = `${size}px`;
        lat.style.height = `${size}px`;
        lat.style.marginLeft = `${-size / 2}px`;
        lat.style.marginTop = `${-size / 2}px`;

        lat.style.transform =
            `translateZ(${Math.sin(i * Math.PI / 180) * radius}px)
             rotateX(90deg)`;

        globe.appendChild(lat);
    }

    // Create longitude lines
    for (let i = 0; i < 180; i += 15) {
        const lon = document.createElement("div");
        lon.className = "longitude";

        lon.style.width = `${radius * 2}px`;
        lon.style.height = `${radius * 2}px`;
        lon.style.marginLeft = `${-radius}px`;
        lon.style.marginTop = `${-radius}px`;

        lon.style.transform =
            `rotateY(${i}deg)`;

        globe.appendChild(lon);
    }
</script>

</body>
</html>
